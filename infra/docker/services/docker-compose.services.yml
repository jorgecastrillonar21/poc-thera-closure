services:
  # Auth Microservice
  auth-service:
    build:
      context: ../../services/auth
      dockerfile: Dockerfile
    container_name: theraclosure-auth-service
    restart: unless-stopped
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: theraclosure
      DB_PASSWORD: password123
      DB_NAME: theraclosure_auth
      DB_SSL_MODE: disable
      
      # JWT Configuration  
      JWT_SECRET: your-super-secret-key-change-in-production
      JWT_ACCESS_TOKEN_DURATION: 1h
      JWT_REFRESH_TOKEN_DURATION: 168h
      
      # Server Configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3001
      SERVER_MODE: release
      
      # Application Configuration
      APP_NAME: theraclosure-auth-service
      APP_VERSION: 1.0.0
      APP_LOG_LEVEL: info
    ports:
      - "3001:3001"
    networks:
      - theraclosure-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Users Microservice
  users-service:
    build:
      context: ../../services/users
      dockerfile: Dockerfile
    container_name: theraclosure-users-service
    restart: unless-stopped
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: theraclosure
      DB_PASSWORD: password123
      DB_NAME: theraclosure_users
      DB_SSL_MODE: disable
      
      # Server Configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3002
      SERVER_MODE: release
      
      # Application Configuration
      APP_NAME: theraclosure-users-service
      APP_VERSION: 1.0.0
      APP_LOG_LEVEL: info
    ports:
      - "3002:3002"
    networks:
      - theraclosure-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Geolocation Microservice
  geolocation-service:
    build:
      context: ../../services/geolocation
      dockerfile: Dockerfile
    container_name: theraclosure-geolocation-service
    restart: unless-stopped
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: theraclosure
      DB_PASSWORD: password123
      DB_NAME: theraclosure_geolocation
      DB_SSL_MODE: disable
      
      # Server Configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3003
      SERVER_MODE: release
      
      # Application Configuration
      APP_NAME: theraclosure-geolocation-service
      APP_VERSION: 1.0.0
      APP_LOG_LEVEL: info
      
      # World Data Seeding Configuration
      SEED_DATA: "true"
      GEONAMES_USERNAME: demo
    ports:
      - "3003:3003"
    networks:
      - theraclosure-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - geolocation_data:/app/data

  # Payments Microservice
  payments-service:
    build:
      context: ../../services/payments
      dockerfile: Dockerfile
    container_name: theraclosure-payments-service
    restart: unless-stopped
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: theraclosure
      DB_PASSWORD: password123
      DB_NAME: theraclosure_payments
      DB_SSL_MODE: disable
      
      # Server Configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3004
      
      # Application Configuration
      APP_NAME: theraclosure-payments-service
      APP_VERSION: 1.0.0
      APP_LOG_LEVEL: info
      
      # Stripe Configuration (use test keys - replace with your own)
      STRIPE_PUBLIC_KEY: pk_test_51234567890abcdef...
      STRIPE_SECRET_KEY: sk_test_51234567890abcdef...
      STRIPE_WEBHOOK_SECRET: whsec_1234567890abcdef...
    ports:
      - "3004:3004"
    networks:
      - theraclosure-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  geolocation_data:

networks:
  theraclosure-network:
    external: true
    name: docker_theraclosure-network