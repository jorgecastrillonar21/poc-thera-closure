services:
  postgres:
    image: postgres:15-alpine
    container_name: theraclosure-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: theraclosure
      POSTGRES_USER: theraclosure
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - theraclosure-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theraclosure"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: theraclosure-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - theraclosure-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: theraclosure-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - theraclosure-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  theraclosure-network:
    driver: bridge
