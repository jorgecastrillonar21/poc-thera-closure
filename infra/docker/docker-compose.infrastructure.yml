services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: theraclosure-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: theraclosure
      POSTGRES_USER: theraclosure
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - theraclosure-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theraclosure"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: theraclosure-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - theraclosure-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: theraclosure-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - theraclosure-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: theraclosure-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@theraclosure.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ../../pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ../../pgadmin/pgpass:/tmp/pgpass:ro
    networks:
      - theraclosure-network
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      cp /tmp/pgpass /var/lib/pgadmin/pgpass;
      chmod 600 /var/lib/pgadmin/pgpass;
      chown pgadmin:pgadmin /var/lib/pgadmin/pgpass;
      /entrypoint.sh
      "

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  theraclosure-network:
    driver: bridge
